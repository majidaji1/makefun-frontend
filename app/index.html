<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content=width=device-width,initial-scale=1>
<title>make.fun</title>
<style>
body{margin:0;background:#101114;color:#e8eaed;font:13px monospace}
a{color:inherit;text-decoration:none}
header,main,aside,#rows,#view,.m,.srow{display:flex}
header{align-items:center;justify-content:space-between;padding:5px 10px;background:#181a1e}
#meter{color:#a8b1bd;font-size:10px}
main{height:calc(100vh - 26px)}
aside{flex:0 0 320px;flex-direction:column;border-right:1px solid #24272c}
#rows,#view{flex:1;flex-direction:column;overflow:auto}
#rows,#view,.v{scrollbar-width:thin;scrollbar-color:#2a2f36 transparent}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#2a2f36;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
#q{margin:6px;padding:5px 7px;border:0;background:#181a1e;color:#e8eaed;font:inherit}
.s,.m,.srow{color:#b6bdc8;font-size:11px}
.row{padding:6px 10px;border-bottom:1px solid #24272c}
.row.on{background:rgba(255,255,255,.12);border-left:2px solid #5e8;padding-left:8px}
.row.on b{font-weight:600;color:#fff}
.m{gap:6px;white-space:nowrap}
.m span+span:before{content:"· ";color:#8a929e}
.row b{display:block}
h1{font-size:13px;margin:0}
h2{margin:0 0 6px}
.w,.cd,.back,summary,.srow a{color:#5e8}
.srow{gap:8px;height:28px;padding:3px 10px;border-bottom:1px solid #24272c}
.srow a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v{height:60vh;overflow:auto}
p{margin:0 0 8px;line-height:1.4}
h3,h4{margin:12px 0 4px}
h4{font-size:12px}
ul{list-style:none;padding-left:11px}
li:before{content:"· "}
code{background:#1d2229}
@media(max-width:700px){main{flex-direction:column;height:auto}aside{flex:0 0 auto;max-height:56vh;border:0}body.det aside{display:none}.back{display:inline-block}}
</style>
</head>
<body>
<header>
<h1>make.fun</h1>
<span id=meter></span>
</header>
<main>
<aside>
<input id="q" placeholder=filter...>
<div id="rows"></div>
</aside>
<section id="view"></section>
</main>
<script>
const $=s=>document.querySelector(s),V=$('#view'),R=$('#rows'),Q=$('#q'),M=$('#meter'),A='https://make.fun/api/';
const F=15e3,NP=20,K=new Map(),N={r:0,c:0},S={n:new Map(),ls:0,k:0,g:0,a:''};
const BK='<a class=back href="#/">← board</a>';
const X=s=>(s==null?'':''+s).replace(/[&<]/g,c=>'&#'+c.charCodeAt(0)+';');
const U=v=>v?'$'+v:'—';
const WR=x=>x.values?.judge!=null?(x.values.judge/1e4).toFixed(2)+'%':'—';
const LT=t=>{const n=(Date.parse(t)-Date.now())/1e3|0;if(n<1)return'closed';const d=n/86400|0,h=n%86400/3600|0,m=n%3600/60|0;return d?d+'d '+h+'h':h+'h '+('0'+m).slice(-2)+'m '+('0'+n%60).slice(-2)+'s'};
const CD=t=>'<span class=cd data-t="'+t+'">'+LT(t)+'</span>';
const J=a=>a.filter(Boolean).join(' · ');
const PN=()=>M.textContent=N.r+' req · '+N.c+' cached';
// Markdown: X() escapes the API text first, so the tags below are all the markup.
const Z=(k,s)=>'<'+k+'>'+s+'</'+k+'>';
const MD=t=>X(t||'')
.replace(/^[ \t]*(#{1,6})\s+(.*)$/gm,(a,h,x)=>Z('h'+(h<'###'?3:4),x))
.replace(/(?:^[ \t]*[-*]\s+.*\n?)+/gm,u=>Z('ul',u.trim().split('\n').map(l=>Z('li',l.trim().slice(2))).join('')))
.replace(/^(?!<)(.+)$/gm,(a,x)=>Z('p',x)).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
async function F1(p){
const u=A+p,h=K.get(u),n=Date.now();
if(h&&n-h.t<F){N.c++;PN();return[h.body,h.src]}
N.r++;PN();const r=await fetch(u,{headers:{Accept:'application/json'},cache:'no-cache'});
if(!r.ok)throw Error(r.status);
const b=await r.json();K.set(u,{body:b,t:n,src:n});PN();return[b,n]}
function MT(k,g,h){if(S.k==k&&S.g==g)return;S.k=k;S.g=g;V.innerHTML=h;V.scrollTop=0}
const MK=()=>{const r=document.createElement('a');r.className='row';r.innerHTML='<b></b><div class=m><span class=w></span><span></span><span class=cd></span></div>';return r};
const HL=()=>{for(const[k,r]of S.n)r.classList.toggle('on',k==S.a)};
const ORD=t=>{const n=Date.now(),f=x=>(x=Date.parse(x.deadline))>n?x:1e16-x;return t.slice().sort((a,b)=>f(a)-f(b))};
function PR(r,x){const m=r.children[1],c=m.children[2];
r.children[0].textContent=x.title;m.children[0].textContent=U(x.rewardAmount);
m.children[1].textContent='pot '+U(x.potUsd)+' · '+x.submissionCount+' entries';
c.dataset.t=x.deadline;c.textContent=LT(x.deadline);r.href='#/bounty/'+x.slug}
function FT(){const q=Q.value.trim().toLowerCase();for(const r of R.children)r.hidden=!!q&&!r.textContent.toLowerCase().includes(q)}
function FL(d){const t=ORD(d.items||[]),s=new Set();for(const x of t){s.add(x.slug);let r=S.n.get(x.slug);if(!r){r=MK();S.n.set(x.slug,r)}R.append(r);PR(r,x)}for(const[k,r]of S.n)if(!s.has(k)){r.remove();S.n.delete(k)}HL()}
async function SY(){const[l,s]=await F1('competitions');if(S.ls!==s){FL(l);S.ls=s}return l}

async function BD(){
const d=await SY(),t=d.items||[],o=t.filter(x=>Date.parse(x.deadline)>Date.now()).sort((a,b)=>a.deadline.localeCompare(b.deadline));
MT('',S.ls,'<h2>Board · '+o.length+' of '+t.length+' open</h2>'+
o.slice(0,12).map(x=>'<div class=srow><a href="#/bounty/'+x.slug+'">'+X(x.title)+'</a>'+U(x.rewardAmount)+' · pot '+U(x.potUsd)+' · '+(x.entryFeeUsd?'fee '+U(x.entryFeeUsd):'free')+' · '+x.submissionCount+' entries</div>').join(''))}

async function DT(q){
const[d,s]=await F1('competitions/'+q);await SY();
MT('b/'+q,s+':'+S.ls,BK+'<h2>'+X(d.title)+'</h2><p class=s>'+J(['reward '+U(d.rewardAmount),'pot '+U(d.potUsd),d.entryFeeUsd?'fee '+U(d.entryFeeUsd):'free',d.submissionCount+' entries',Date.parse(d.deadline)>Date.now()?'open':'closed',d.publishedAt.slice(5,10)+' → '+d.deadline.slice(5,10)])+'</p>'+
((d.rewardsNow||[]).length?'<p class=s>'+J(d.rewardsNow.slice(0,5).map(r=>'#'+r.place+' '+U(r.amountUsd)))+'</p>':'')+
(d.summary?'<p class=s>'+X(d.summary)+'</p>':'')+
'<p class=s>closes in '+CD(d.deadline)+' <a href="#/bounty/'+q+'/leaderboard">leaderboard →</a></p>'+
MD(d.description)+'<details><summary>rules</summary>'+MD(d.rules||'')+'</details>')}

async function LB(q){
const[d,s]=await F1('competitions/'+q+'/leaderboard');await SY();
const e=d.entries||[],n=e.length,w=Math.min(NP,n);
MT('l/'+q,s+':'+q+':'+S.ls,'<a class=back href="#/bounty/'+q+'">← bounty</a><h2>'+X(d.title||'Leaderboard')+'</h2><p class=s>'+n+' entries · '+w+' rows in the DOM · spacers</p>'+
'<div class=v></div>');
const sc=V.querySelector('.v');
sc.innerHTML='<div></div><div></div><div></div>';
const sa=sc.children[0],bl=sc.children[1],sd=sc.children[2];
bl.innerHTML='<div class=srow><span></span><a></a><span></span></div>'.repeat(w);
const dr=()=>{const s0=Math.max(0,Math.min(sc.scrollTop/28|0,n-w));
sa.style.height=s0*28+'px';sd.style.height=(n-s0-w)*28+'px';
for(let j=0;j<w;j++){const i=s0+j,x=e[i],r=bl.children[j],z=r.children;
if(r.dataset.i==''+i)continue;r.dataset.i=i;
z[0].textContent='#'+x.rank;z[1].textContent='@'+x.handle;z[1].href='#/u/'+x.handle;z[2].textContent=WR(x)}};
sc.onscroll=()=>requestAnimationFrame(dr);dr()}

async function PF(h){
const l=await SY(),bs=new Set();let c=0,nw=null,rk=null,tt=0;
for(const x of l.items||[])for(const y of x.submissions||[])if(y.hunter==h){c++;bs.add(x.slug);if(!nw||y.createdAt>nw[1].createdAt)nw=[x,y]}
for(const[u,v]of K){if(!u.endsWith('/leaderboard'))continue;const z=(v.body.entries||[]).find(z=>z.handle==h);if(z){rk=z;tt=v.body.entries.length;break}}
MT('u/'+h,S.ls+':'+h+':'+(rk?rk.rank:'-'),BK+'<h2>@'+X(h)+'</h2><p class=s>'+
J([c+' entries',bs.size+' bounties',nw&&X(nw[0].title)+' '+X(nw[1].status||'')+' '+nw[1].createdAt.slice(5,16).replace('T',' '),rk&&'rank #'+rk.rank+' of '+tt,rk&&WR(rk)+' win rate',rk&&rk.judge&&rk.judge.wins+'W '+rk.judge.losses+'L '+rk.judge.draws+'D'])+'</p>')}

function MS(h,m){MT(h,'x',BK+'<h2>'+h+'</h2><p class=s>'+m+'</p>')}

async function RT(){
const raw=decodeURIComponent(location.hash.replace(/^#\/?/,'')),p=raw.split('/');
document.body.classList.toggle('det',raw!='');
S.a=p[0]=='bounty'?p[1]||'':'';HL();
window.__shotReady=false;
try{
await (!raw?BD():p[0]=='bounty'&&p[1]&&p[2]=='leaderboard'?LB(p[1]):p[0]=='bounty'&&p[1]&&p.length==2?DT(p[1]):p[0]=='u'&&p[1]&&p.length==2?PF(p[1]):MS('Not found','"#/'+X(raw)+'" is no route: nothing fetched'))}catch(e){MS('Request failed',X(e&&e.message||e)+' — retry later')}
window.__shotReady=true}
setInterval(()=>{for(const e of document.querySelectorAll('[data-t]'))e.textContent=LT(e.dataset.t)},1e3);
Q.addEventListener('input',FT);
addEventListener('hashchange',RT);
RT();
</script>
</body>
</html>
