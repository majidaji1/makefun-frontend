<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>make.fun board — live bounties, leaderboards, profiles</title>
<meta name="description" content="A fast read-only client for make.fun: open bounties with rewards, entry fees and countdowns, full bounty pages, live leaderboards and public profiles.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#view">Skip to the main view</a>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="make.fun board, home">
      <span class="brand-mark" aria-hidden="true">mf</span>
      <span class="brand-text">make<span class="brand-dot">.</span>fun<em>board</em></span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/" data-nav="board">Board</a>
      <a href="https://make.fun/bounties" rel="noopener">make.fun</a>
    </nav>
    <p class="live" id="live" aria-live="polite" aria-atomic="true">connecting…</p>
  </div>
</header>

<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<main id="view" tabindex="-1" aria-busy="true">
  <div class="boot">
    <p class="boot-line">Loading the board…</p>
    <p class="boot-hint">Reading live data from <code>make.fun/api</code>.</p>
  </div>
</main>

<footer class="foot">
  <div class="foot-in">
    <p>Read-only view of the live <a href="https://make.fun" rel="noopener">make.fun</a> API. No account, nothing written.</p>
    <p class="foot-meta"><span id="clock">--:--:--</span> UTC · <a href="https://make.fun/api/openapi.json" rel="noopener">API</a></p>
  </div>
</footer>

<script type="module" src="/main.js"></script>
</body>
</html>
